[project]
name = "sklearn-ann"
description = "Various integrations for ANN (Approximate Nearest Neighbours) libraries into scikit-learn."
authors = [
    { name = "Frankie Robertson", email = "frankie@robertson.name" },
    { name = "Philipp Angerer", email = "phil.angerer@gmail.com" }
]
license = "BSD-3-Clause"
urls.Source = "https://github.com/scikit-learn-contrib/sklearn-ann"
urls.Documentation = "https://sklearn-ann.readthedocs.io/"
dynamic = ["version", "readme"]
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.6.0",
    "scipy>=1.11.1,<2.0.0",
]

[project.optional-dependencies]
annoy = [
    "annoy>=1.17.0,<2.0.0",
]
faiss = [
    "faiss-cpu>=1.6.5,<2.0.0",
]
hannoy = [
    "hannoy>=0.1.3",  # TODO: bump to the actual version containing `by_array`
]
pynndescent = [
    "pynndescent>=0.5.1,<1.0.0",
    "numba>=0.52",
]
nmslib = [
    "nmslib-metabrainz>=2.1.1,<3.0.0",
]
annlibs = [
    "sklearn-ann[annoy,faiss,hannoy,pynndescent,nmslib]",
]

[dependency-groups]
docs = [
    "sphinx>=7",
    "sphinx-gallery>=0.8.2",
    "sphinx-book-theme>=1.1.0",
    "sphinx-issues>=1.2.0",
    "numpydoc>=1.1.0",
    "matplotlib>=3.3.3",
    "scanpydoc",
]
tests = [
    "pytest>=6.2.1",
    "pytest-cov>=2.10.1",
]
typing = [
    "mypy",
    "matplotlib",  # examples are type checked, too
    "scipy-stubs",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.rst"
start-after = ".. inclusion-marker-do-not-remove\n\n"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
# Flaky tests should be marked as xfail(strict=False),
# this will notify us when a test considered broken starts succeeding.
xfail_strict = true

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # Pycodestyle errors
    "W", # Pycodestyle warnings
    "I", # Isort
    "UP", # Pyupgrade
    "PT", # Pytest style
    "PTH", # Pathlib
    "RUF", # Ruff’s own rules
    "T20", # print statements
    "TC",  # type checking
]
ignore = [
    # Don’t complain about “confusables”
    "RUF001", "RUF002", "RUF003"
]
[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402", "T20"]
"tests/*.py" = ["T20"]
[tool.ruff.lint.isort]
known-first-party = ["sklearn_ann"]
required-imports = ["from __future__ import annotations"]
[tool.ruff.lint.flake8-type-checking]
exempt-modules = []
strict = true

[tool.hatch.envs.docs]
installer = "uv"
features = ["annlibs"]
dependency-groups = ["docs"]
scripts.build = "sphinx-build -M html docs docs/_build"

[tool.hatch.envs.hatch-check-types]
features = ["annlibs"]
dependency-groups = ["tests", "typing"]
scripts.check = "mypy {args:.}"

[tool.hatch.envs.hatch-test]
default-args = []
features = ["annlibs"]
dependency-groups = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/sklearn_ann"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "tests"]
strict = true
explicit_package_bases = true # pytest doesn’t do __init__.py
no_implicit_optional = true
disallow_untyped_decorators = false # e.g. pytest.mark.parametrize
follow_untyped_imports = true
# follow_untyped_imports makes these readable, but not annotated
untyped_calls_exclude = ["sklearn", "joblib", "pynndescent"]

[[tool.mypy.overrides]]
# pynndescent has no __all__, so its re-exports are implicit
module = ["pynndescent"]
no_implicit_reexport = false

[[tool.mypy.overrides]]
# nmslib is a compiled extension module without stubs
module = ["nmslib"]
ignore_missing_imports = true

[tool.uv.sources]
hannoy.git = "https://github.com/nnethercott/hannoy.git"  # TODO: remove once 0.1.4/0.2 is released

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"
